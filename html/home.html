<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>TaskFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/newhome.js" defer></script>
</head>
<body>
    <div id="overallDiv">
    
        <header id="header">
            <img class="logo" src="../assets/TFlogo.svg">

            <div class="header-icons">
                <!-- <img id="notification"   class="header-icon" src="../assets/Notification.svg" alt="Notification"> -->
                <img id="darkModeBtn"  class="header-icon" src="../assets/Dark mode.svg" alt="dark-mode">
            </div>
        </header>

         <section id="first-section">
            <div>
                <h2>Today</h2>
                <p>Wed, Jan 21</p>
            </div>
            <button id="firstSectionButton">Add task</button>
        </section>
        
        <section id="search-area">
            <input placeholder="Search" id="searchInput" type="text">
            <button id="searchBtn">
                <img id="searchIcon" src="../assets/search.svg">
            </button>
        </section>

        <section id="filter-buttons">
            <button class="filter">All</button>
            <button class="filter All">Active</button>
            <button class="filter">Completed</button>
            <button class="filter">Missed</button>
        </section>

        <section id="taskList">     
            <h4 id="emptyTaskPrompt">Add task to display.</h4>
        </section>

        <section id="popup">
            <form id="addTaskPopup">
                <h2>Add New Task</h2>

                <label class="popupLabel">Task title
                <input required type="text" id="taskName" placeholder="e.g Redesign login page">
                </label>

                <label class="popupLabel">Description
                <textarea id="taskDesc" placeholder="e.g  Implement corrections before Monday"></textarea>
                </label>

                <div class="group-div">
                <label class="popupLabel">Due Date
                    <input id="date" type="date" required>
                </label>
                
                <label class="popupLabel"> Due time
                    <input id="time" type="time" required>
                </label>
                </div>

            <button id="addTaskBtn">Add Task</button>
            </form>
        </section>
    </div>
