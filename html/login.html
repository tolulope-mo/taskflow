<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/signup.css">
  <script defer src="../js/login.js"></script>
</head>
<body>
  <img class="logo" src="../assets/TFlogo.svg" alt="Logo">
  
  <h2 id="heading" style="font-weight: 500; font-size: 20px; padding-bottom: 10px;">Login to add and organize your tasks.</h2>
  
  <div class="bigContainer">
    <form id="form">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="john@example.com" required>
      <p id="incorrect-mail-prompt">Enter valid email address</p>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="********" required>
        <img src="../assets/hidePassword.svg" class="toggle-password">
      </div>

      <p id="incorrect-password-prompt">Password must contain min of 8 words, a special character and number</p>   


      <button id="button" >Log in</button>
    </form>

    <p class="to-sign-up">
      Don't have an account? <a class="signup-link" href="../html/signup.html">Sign up</a>
    </p>
  </div>
</body>
</html>
