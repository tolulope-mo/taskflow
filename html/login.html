<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
  <script defer src="../js/login.js"></script>
</head>
<body>
  <img class="logo" src="../assets/TFlogo.svg" alt="Logo">
    <div class="bigContainer">

    <h2>Welcome Back</h2>
    <p>Enter your login details to access your tasks</p>

    <form id="form">
       <label for="email">Email</label>
      <input type="email" id="email" placeholder="john@example.com" required>
      <p id="incorrect-mail-prompt" style="display: none; font-size: 14px; color: #FF9326; font-weight: 500; margin-bottom: 2px;">* Enter valid email address</p>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="********" required>
        <img src="../assets/hidePassword.svg" class="toggle-password">
      </div>

      <p id="incorrect-password-prompt1" style="display: none; font-size: 14px; color: #FF9326; font-weight: 500; margin-bottom: 0px;">Minimum of 8 words</p>
      <p id="incorrect-password-prompt2" style="display: none; font-size: 14px; color: #FF9326; font-weight: 500; margin-bottom: 0px;">Must contain a special character and number</p>    


      <button>Login</button>
    </form>

    <p class="to-sign-up">
      Don't have an account? <a class="signup-link" href="../html/signup.html">Sign up</a>
    </p>
  </div>
</body>
</html>
