<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home2.css">
</head>

<body>
    <div id="overall-div">
    <header id="header">
        <img class="logo" src="../assets/TFlogo.svg">
        <div class="header-icons">
            <img id="notification" src="../assets/Notification.svg" alt="Notification">
            <img id="darkModeBtn" src="../assets/Dark mode.svg" alt="dark-mode">
        </div>
    </header>

    <section id="first-section">
        <div>
            <h2>Today</h2>
            <p>Wed, Jan 21</p>
        </div>
        <button id="firstSectionButton">Add task</button>
    </section>

    <section id="search-area">
        <input placeholder="Search" type="text">
        <button id="searchBtn">
            <img id="searchIcon" src="../assets/search.svg">
        </button>
    </section>

    <section id="filter-buttons">
        <button class="filter active">All</button>
        <button class="filter">Completed</button>
        <button class="filter">Missed</button>
    </section>

    <!-- Task List (You will append tasks here later with JS) -->
    <section id="task-list">
        <!-- Example task to show layout -->
        <div class="task-card yellow">
            <input type="checkbox">
            <div>
                <h3>Finish Dev project</h3>
                <p>May 12 - May 30 • 8:30AM - 7:00PM</p>
            </div>
        </div>
    </section>

    <!--popup to add task  -->
    <div id="popupBg">
        <div id="addTaskPopup">
            <h2>Add New Task</h2>

            <label>Task Name</label>
            <input type="text" id="taskName">

            <label>Description</label>
            <textarea id="taskDesc"></textarea>

            <button id="addTaskBtn">Add Task</button>
        </div>
    </div>

    <script src="../js/home.js"></script>
    </div>
</body>
</html>
